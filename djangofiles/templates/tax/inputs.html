<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Entry Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2em;
            max-width: 600px;
            margin: auto;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1em;
        }
        label {
            font-weight: bold;
        }
        input[type="number"] {
            padding: 0.5em;
            font-size: 1em;
            width: 15%;
        }
        button {
            padding: 0.75em;
            font-size: 1em;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>

<h2>Enter Tax Information</h2>

<form method="POST">
    {% csrf_token %}

    {{ formset }}

    <input type="submit" value="Submit">
</form>

<h2>Previous Inputs</h2>

{{ inputs }}

<a href="{% url 'tax:index' %}">Return to index</a>
