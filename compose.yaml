services:
  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - 5173:5173
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  api:
    build: ./djangofiles
    env_file:
      - ./djangofiles/.env
    ports:
      - 8000:8000
